# Publica o orkmind no PyPI por Trusted Publishing (OIDC): nenhum token nem senha fica em maquina
# nenhuma. O dono configura uma vez em pypi.org > projeto orkmind > Manage > Publishing > GitHub,
# com owner `orkastery`, repositorio `orkmind`, workflow `publicar.yml` e ambiente `pypi`.
# Dispara pela tag `v<versao>` num commit da main, e so publica quando a tag bate com a versao do
# pyproject e do pacote, a suite sem banco passa e os artefatos passam na conferencia.
name: Publicar no PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construir:
    name: conferir e construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: a tag e a versao do pacote
        run: |
          versao=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$versao" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME e pyproject $versao divergem"; exit 1; }
          grep -qx "__version__ = \"$versao\"" src/orkmind/__init__.py || { echo "src/orkmind/__init__.py nao declara $versao"; exit 1; }

      - name: a tag esta na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: testes sem banco
        run: |
          python -m pip install -e ".[dev,memory-provider,documents,qdrant,encryption]"
          python -m pytest -m "not integration" -q

      - name: construir e conferir
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
          python .github/scripts/conferir_pacote.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: distribuicoes
          path: dist/
          if-no-files-found: error

  # Job separado: so ele recebe o token OIDC, e so depois de tudo acima passar.
  publicar:
    name: publicar no PyPI
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/orkmind/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribuicoes
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
