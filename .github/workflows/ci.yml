# CI do OrkMind: roda em todo PR e em todo push na main.
#
# Sem Postgres. Os modulos que precisam de banco isolado levam a marca `integration` e ficam de
# fora com `-m "not integration"`; os demais testes que dependem de variavel de banco se pulam
# sozinhos pela guarda do conftest. Com um banco de testes, rode `pytest` inteiro localmente
# (ORKMIND_TEST_DATABASE_URL e ORKMIND_PROVIDER_TEST_DATABASE_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: instalar
        run: python -m pip install -e ".[dev,memory-provider,documents,qdrant,encryption]"
      - name: testes sem banco
        run: python -m pytest -m "not integration" -q

  # O que vai ao PyPI: constroi sdist e wheel, confere metadados, lista o sdist, barra material
  # interno e cara de credencial, e instala o wheel num venv limpo, fora do checkout.
  pacote:
    name: pacote (sdist e wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: construir
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: conteudo dos artefatos
        run: python .github/scripts/conferir_pacote.py dist
      - name: wheel instala limpo
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install dist/*.whl
          cd /tmp
          /tmp/limpo/bin/orkmind --version
          /tmp/limpo/bin/python -c "from importlib import resources; assert resources.files('orkmind.store').joinpath('company_brain_v1.sql').is_file()"

  plugin-openclaw:
    name: plugin OpenClaw (memory-orkmind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/openclaw/memory-orkmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: instalar
        run: npm ci
      - name: testes
        run: npm test
      - name: compilar
        run: npm run build
